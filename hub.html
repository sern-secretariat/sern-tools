<style>
/* ─────────────────────────────────────────────────────────────
   SERN palette — same as the Mission and General Expense tools
   ───────────────────────────────────────────────────────────── */
:root{
  --navy:#1F4E79; --navy-deep:#163A5A; --blue:#2D6A9F; --sky:#A8C8E8;
  --mist:#EBF4FB; --line:#E8EEF5; --ink:#1A2E42; --muted:#4A6880;
  --gold:#C9A84C; --gold-soft:#F5EDD6; --white:#fff;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}

/* ── Header band ── */
.band{background:var(--navy);color:var(--white);padding:18px 0 34px;position:relative;overflow:hidden}
.band::after{ /* the SERN axis: a quiet gold line linking Italy and Sweden */
  content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--gold) 0 50%,var(--sky) 50% 100%)}
.top{display:flex;align-items:center;gap:12px}
.logo{height:64px;width:64px;background:#fff;border-radius:10px;padding:4px;flex-shrink:0;box-shadow:0 0 0 2px rgba(201,168,76,.55)}
@media (max-width:480px){.logo{height:52px;width:52px}}
.logo-fallback{width:38px;height:38px;border-radius:8px;background:var(--gold);color:var(--navy);
  display:none;align-items:center;justify-content:center;font:700 17px var(--serif)}
.brand{font:700 17px var(--serif)}
.brand small{display:block;font:400 12px var(--sans);color:var(--sky)}
.switch{margin-left:auto;background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;
  padding:7px 12px;border-radius:7px;font:600 13px var(--sans);cursor:pointer}
.switch:hover{border-color:var(--gold);color:var(--gold)}
.hello{margin-top:30px}
.hello h1{font:400 clamp(28px,5vw,42px)/1.15 var(--serif);letter-spacing:-.01em}
.hello p{color:var(--sky);margin-top:6px;font-size:14px}

/* ── Main grid ── */
main.wrap{padding-top:30px;padding-bottom:40px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
h2{font:700 19px var(--serif);color:var(--navy);margin-bottom:12px}
.hint{color:var(--muted);font-size:13px;margin:-6px 0 14px}

/* ── Projects ── */
.projects{display:flex;flex-direction:column;gap:14px}
.proj{background:#fff;border-left:5px solid var(--navy);border-radius:4px 10px 10px 4px;padding:16px 18px;
  box-shadow:0 1px 0 var(--line)}
.proj.off{border-left-color:var(--sky)}
.proj-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.proj-name{font:700 20px var(--serif);color:var(--navy)}
.role{font-size:12px;font-weight:600;color:var(--navy-deep);background:var(--gold-soft);padding:2px 9px;border-radius:20px}
.proj-meta{color:var(--muted);font-size:13px;margin-top:2px}
.proj-main{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;text-decoration:none;
  font-weight:600;font-size:14px;padding:9px 15px;border-radius:7px}
.proj-main:hover{background:var(--navy-deep)}
.proj-more{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);list-style:none}
.proj-more a{font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--sky)}
.proj-more a:hover{border-bottom-color:var(--blue)}
.proj-off{margin-top:10px;font-size:13px;color:var(--muted)}

/* ── Side column ── */
.side{display:flex;flex-direction:column;gap:26px}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:13px 14px;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--navy)}
.tile .ico{font-size:22px;line-height:1;flex-shrink:0;width:30px;text-align:center;padding-top:2px}
.tile b{display:block;font:700 15px var(--serif);color:var(--navy)}
.tile span{display:block;font-size:13px;color:var(--muted)}
.tile.tower{background:var(--navy);border-color:var(--navy)}
.tile.tower b{color:#fff}.tile.tower span{color:var(--sky)}
.news{list-style:none;display:flex;flex-direction:column;gap:12px}
.news li{padding-left:14px;border-left:2px solid var(--gold)}
.news time{font-size:12px;color:var(--muted)}
.news p{font-size:14px}
.copy{background:none;border:none;color:var(--blue);font:600 13px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
.empty{background:#fff;border:1.5px dashed var(--sky);border-radius:10px;padding:18px;color:var(--muted);font-size:14px}

/* ── Person picker ── */
.picker{background:#fff;border-radius:12px;padding:24px;max-width:640px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.person{text-align:left;background:var(--mist);border:2px solid transparent;border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.person:hover{border-color:var(--navy)}
.person b{display:block;font:700 15px var(--serif);color:var(--navy)}
.person span{font-size:12.5px;color:var(--muted)}

footer{color:var(--muted);font-size:12.5px;padding:0 0 30px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

h2.sub{margin-top:26px}
.closed{margin-top:22px}
.closed summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:12px}
/* ── Knowledge base ── */
.kb{margin-top:40px;background:#fff;border-radius:12px;padding:22px 22px 26px;border-top:4px solid var(--gold)}
.kb-head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.kb-head h2{margin:0}
#kbSearch{flex:0 1 300px;width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:7px;font:14px var(--sans);color:var(--ink)}
#kbSearch:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(45,106,159,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.chip{background:var(--mist);border:1.5px solid transparent;color:var(--navy);border-radius:20px;padding:5px 13px;font:600 13px var(--sans);cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
.kb-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:760px){.kb-grid{grid-template-columns:1fr}}
.kb h3{font:700 15px var(--serif);color:var(--navy);margin-bottom:10px}
.docs{list-style:none;display:flex;flex-direction:column}
.doc{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.doc b{color:var(--navy);font-weight:600}
.doc a{text-decoration:none}.doc a:hover b{text-decoration:underline}
.doc em{font-size:12px;color:var(--muted)}
.doc span:not(.kind){display:block;font-size:13px;color:var(--muted)}
.kind{flex-shrink:0;width:52px;text-align:center;font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 0;height:fit-content;margin-top:2px}
.k-policy{background:var(--navy);color:#fff}.k-guide{background:var(--gold-soft);color:var(--navy-deep)}
.qa{border-bottom:1px solid var(--line)}
.qa summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--ink);list-style-position:outside}
.qa[open] summary{color:var(--navy)}
.qa p{padding:0 0 12px;color:var(--muted);font-size:14px;max-width:65ch}
.none{color:var(--muted);font-size:14px;padding:6px 0}
</style>

}
function fmtDate(d){
  return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function assignments(p){
  const own = (p.projects||[]).map(([code,role])=>[PROJECTS.find(x=>x.code===code),role]).filter(a=>a[0]&&!a[0].closed);
  const ownCodes = own.map(a=>a[0].code);
  const others = p.allProjects ? PROJECTS.filter(x=>!x.closed && !ownCodes.includes(x.code)).map(x=>[x,p.allProjects]) : [];
  return {own, others, closed: p.allProjects ? PROJECTS.filter(x=>x.closed).map(x=>[x,p.allProjects]) : []};
}

function projectCard(pr, role){
  const r = ROLE_TOOLS[role] || ROLE_TOOLS.pm;
  const head = `
    <div class="proj-head">
      <span class="proj-name">${esc(pr.name)}</span>
      <span class="role">${esc(r.label)}</span>
    </div>
    ${pr.meta?`<div class="proj-meta">${esc(pr.meta)}</div>`:''}`;
  if(!pr.monitoring){
    return `<article class="proj off">${head}
      <p class="proj-off">Monitoring isn’t set up for this project yet.</p></article>`;
  }
  const base = MONITORING_BASE + pr.code + '/';
  const [first,...rest] = r.tools;
  return `<article class="proj">${head}
    <a class="proj-main" href="${base+first[0]}">${esc(first[1])}</a>
    <ul class="proj-more">${rest.map(t=>`<li><a href="${base+t[0]}">${esc(t[1])}</a></li>`).join('')}</ul>
  </article>`;
}

function tile(t, extraClass='', person){
  const url = person && t.url.startsWith(TOOLS_BASE) ? t.url + '?emp=' + encodeURIComponent(person.id) : t.url;
  return `<a class="tile ${extraClass}" href="${esc(url)}">
    <span class="ico" aria-hidden="true">${t.ico||'🔗'}</span>
    <span><b>${esc(t.title)}</b><span>${esc(t.desc||'')}</span></span></a>`;
}

function render(id){
  const p = STAFF.find(s=>s.id===id);
  if(!p){ showPicker(); return; }
  store.set(p.id);
  history.replaceState(null,'','?u='+p.id);
  $('switchBtn').hidden = false;
  document.title = 'SERN Staff Hub · ' + p.name.split(' ')[0];

  $('hello').innerHTML = `<h1>${greeting()}, ${esc(p.name.split(' ')[0])}</h1>
    <p>${esc(p.role)} · ${today()}</p>`;

  const {own,others,closed} = assignments(p);
  const byMon = (a,b)=>(b[0].monitoring?1:0)-(a[0].monitoring?1:0);
  others.sort(byMon);
  const cards = l => `<div class="projects">${l.map(([pr,role])=>projectCard(pr,role)).join('')}</div>`;

  let projectsHtml = own.length ? cards(own)
    : `<div class="empty">You aren’t managing a project at the moment, so there are no monitoring tools to show. You can still take part in missions: request them and claim your costs from <b>Missions and expenses</b>. If you’re given a project, it will appear here.</div>`;
  if(others.length) projectsHtml += `<h2 class="sub">Other current projects</h2>${cards(others)}`;
  if(closed.length) projectsHtml += `<details class="closed"><summary>Completed projects (${closed.length})</summary>${cards(closed)}</details>`;

  const extras = (p.links||[]).length
    ? `<section><h2>My links</h2><div class="tiles">${p.links.map(l=>tile(l)).join('')}</div></section>` : '';

  $('main').innerHTML = `
  <div class="grid">
    <section>
      <h2>My projects</h2>
      <p class="hint">Monitoring tools for the projects you manage.</p>
      ${projectsHtml}
    </section>
    <div class="side">
      <section>
        <h2>Missions and expenses</h2>
        <div class="tiles">
          ${p.tower?tile(CONTROL_TOWER,'tower'):''}
          ${EVERYDAY.map(t=>tile(t,'',p)).join('')}
        </div>
      </section>
      ${extras}
      <section>
        <h2>What’s new</h2>
        <ul class="news">${NEWS.map(n=>`<li><time datetime="${n.date}">${fmtDate(n.date)}</time><p>${esc(n.text)}</p></li>`).join('')}</ul>
      </section>
      <section>
        <button class="copy" onclick="copyLink()">Copy my personal link</button>
      </section>
    </div>
  </div>
  ${knowledgeSection()}`;
  bindKnowledge();
}

/* ── Guides, policies and Q&A ── */
function topics(){ return [...new Set([...DOCS,...FAQ].map(x=>x.topic))]; }
function knowledgeSection(){
  return `<section class="kb" id="kb" aria-labelledby="kbTitle">
    <div class="kb-head">
      <h2 id="kbTitle">Guides, policies and Q&amp;A</h2>
      <input type="search" id="kbSearch" placeholder="Search, e.g. transport card" aria-label="Search guides and questions">
    </div>
    <div class="chips" role="group" aria-label="Filter by topic">
      <button class="chip on" data-t="">All</button>
      ${topics().map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}
    </div>
    <div class="kb-grid">
      <div><h3>Guides and policies</h3><ul class="docs" id="docList"></ul></div>
      <div><h3>Questions and answers</h3><div id="faqList"></div></div>
    </div>
  </section>`;
}
function bindKnowledge(){
  const state={t:'',q:''};
  const match = (x,fields)=> (!state.t||x.topic===state.t) &&
    (!state.q || fields.some(f=>(x[f]||'').toLowerCase().includes(state.q)));
  const draw=()=>{
    const d=DOCS.filter(x=>match(x,['title','desc','topic']));
    const f=FAQ.filter(x=>match(x,['q','a','topic']));
    $('docList').innerHTML = d.length ? d.map(x=>`<li class="doc">
        <span class="kind k-${x.kind.toLowerCase()}">${esc(x.kind)}</span>
        <div>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener"><b>${esc(x.title)}</b></a>`:`<b>${esc(x.title)}</b> <em>Link to be added</em>`}
        <span>${esc(x.desc)}</span></div></li>`).join('')
      : `<li class="none">No guides match. Try another word, or ask Nicola.</li>`;
    $('faqList').innerHTML = f.length ? f.map(x=>`<details class="qa"><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join('')
      : `<p class="none">No questions match. If yours isn’t here, send it to Nicola and it will be added.</p>`;
  };
  $('kbSearch').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();draw();});
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); state.t=c.dataset.t; draw();}));
  draw();
}

function showPicker(){
  store.set(null);
  history.replaceState(null,'',location.pathname);
  $('switchBtn').hidden = true;
  document.title = 'SERN Staff Hub';
  $('hello').innerHTML = `<h1>Your tools, in one place</h1><p>${today()}</p>`;
  $('main').innerHTML = `<div class="picker">
    <h2>Who’s using the hub?</h2>
    <p class="hint" style="margin:0">Pick your name. The hub remembers it on this device.</p>
    <div class="people">${STAFF.map(s=>`<button class="person" onclick="render('${s.id}')"><b>${esc(s.name)}</b><span>${esc(s.role)}</span></button>`).join('')}</div>
  </div>`;
}

function copyLink(){
  const url = location.origin + location.pathname + '?u=' + store.get();
  const done = ()=>toast('Link copied — bookmark it or save it to your phone’s home screen.');
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(done,()=>prompt('Copy your link:',url));
  else prompt('Copy your link:',url);
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800);
}

$('ver').textContent = '· v' + VERSION;
const fromUrl = new URLSearchParams(location.search).get('u');
render(fromUrl || store.get() || '');
</script>
</body>
</html>
